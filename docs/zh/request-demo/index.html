  <div class="form-page-heading"><h1 id="inquiry-title">联系 KEWW。</h1><a class="text-link" href="/keww-ui-review/zh/hire-staff/">为企业安排人员</a></div>
  <div class="inquiry-layout">
    <aside class="inquiry-aside"><h2>告诉我们你的需求。</h2><p>如需人员服务，请说明场地位置、所需岗位和预计日期。也可以咨询 KEWW 应用或预约演示。</p><p>已经在使用 KEWW？ <a href="https://app.workwithkeww.com/">登录账户</a>.</p><figure class="inquiry-photo"><img src="/keww-ui-review/assets/photos/staff-three.267c2b685f751bff74940009031cba57bfb9687b49cbb3dc7900ce2efa74b551.webp" width="935" height="1402" alt="Cafe Natalie 团队成员正在布置餐桌" loading="lazy" decoding="async"></figure></aside>
    <noscript><p class="form-notice">此表单需要启用 JavaScript。你也可以 <a href="mailto:admin@workwithkeww.com">通过电子邮件联系 KEWW</a>。</p></noscript>
    <form id="inquiry-form" class="keww-form" novalidate data-form-ui hidden>
      <p class="field-guidance">标有“选填”的项目可以留空。</p>
      <div class="form-errors" id="inquiry-errors" role="alert" tabindex="-1" hidden></div>
      <div class="field"><label for="inquiry-requestType">你需要哪方面的帮助？</label><select id="inquiry-requestType" name="requestType" required><option value="Staffing Inquiry">人员服务咨询</option><option value="Demo Request">应用演示</option><option value="Free Trial Request">试用咨询</option><option value="General Inquiry">其他咨询</option></select></div>
      <div class="field-grid"><div class="field"><label for="inquiry-firstName">名</label><input id="inquiry-firstName" name="firstName" autocomplete="given-name" maxlength="100" required></div><div class="field"><label for="inquiry-lastName">姓</label><input id="inquiry-lastName" name="lastName" autocomplete="family-name" maxlength="100" required></div><div class="field"><label for="inquiry-email">工作邮箱</label><input id="inquiry-email" name="email" type="email" autocomplete="email" maxlength="254" spellcheck="false" required></div><div class="field"><label for="inquiry-phone">电话</label><input id="inquiry-phone" name="phone" type="tel" autocomplete="tel" maxlength="40" required></div></div>
      <div class="field"><label for="inquiry-company">场地或公司</label><input id="inquiry-company" name="company" autocomplete="organization" maxlength="200" required></div>
      <div class="field"><label for="inquiry-venueType">场地类型 <span class="optional">选填</span></label><select id="inquiry-venueType" name="venueType"><option value="">请选择场地类型</option><option value="Hotel">酒店</option><option value="Restaurant">餐厅</option><option value="Event venue">活动场地</option><option value="Stadium">体育场馆</option><option value="Catering company">餐饮服务公司</option><option value="Other">其他</option></select></div>
      <div class="field"><label for="inquiry-message">留言 <span class="optional">选填</span></label><textarea id="inquiry-message" name="message" maxlength="5000" rows="6"></textarea></div>
      <label class="choice consent-choice"><input type="checkbox" name="consent" value="yes" required><span>我同意 KEWW 按照 <a href="/keww-ui-review/privacy-policy/" target="_blank" rel="noopener">隐私政策（英文）<span class="visually-hidden"> （在新标签页中打开）</span></a>处理本次咨询。</span></label>
      <div class="form-trap" aria-hidden="true"><label for="inquiry-website">此项请留空</label><input id="inquiry-website" name="keww_demo_website" autocomplete="off" tabindex="-1"></div>
      <div class="form-actions"><button class="button button-primary" type="submit" id="inquiry-submit">提交咨询</button></div>
      <div class="form-result" id="inquiry-result" role="status" tabindex="-1" hidden></div>
    </form>
